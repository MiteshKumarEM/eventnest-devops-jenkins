services:
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: eventnest-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - eventnest-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: eventnest-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=eventnest-demo
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3003:3000"
    networks:
      - eventnest-network
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: eventnest-alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    networks:
      - eventnest-network
    restart: unless-stopped

  alert-receiver:
    image: eventnest:${RELEASE_TAG:-latest}
    container_name: eventnest-alert-receiver
    command: ["node", "src/alertReceiver.js"]
    environment:
      - ALERT_PORT=3004
      - ALERT_LOG_PATH=/app/data/received-alerts.json
    volumes:
      - alert-data:/app/data
    ports:
      - "3004:3004"
    networks:
      - eventnest-network
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  alert-data:

networks:
  eventnest-network:
    name: eventnest-network
    external: true
