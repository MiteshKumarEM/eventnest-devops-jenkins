global:
  resolve_timeout: 1m

route:
  receiver: eventnest-webhook
  group_by: ['alertname', 'application']
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 1h

receivers:
  - name: eventnest-webhook
    webhook_configs:
      - url: http://eventnest-alert-receiver:3004/alerts
        send_resolved: true
